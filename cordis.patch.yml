# dsh-data-ledger bundle patch: 数据台账 —— 统一本地数据看板
#
# 安装: dsh plugin --profile web add <本目录路径>
# 卸载: dsh plugin --profile web remove dsh-data-ledger
#
# 配置项:
#   enabled        启用插件（默认 true）
#   trashDays      回收站保留天数（默认 30）
#   refreshSeconds 面板自动刷新间隔秒（默认 20）
- insert:
    - id: data-ledger
      name: 'dsh-data-ledger'
      config:
        enabled: true
        trashDays: 30
        refreshSeconds: 20
